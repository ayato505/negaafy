plugins {
    id 'com.android.application'
}

// One version number for both apps: read it from the desktop package.json.
def pkg = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def parts = pkg.version.tokenize('.').collect { it as int }

// Release signing: android/keystore.properties (never committed) points at the keystore.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.ayato.nagham'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ayato.nagham'
        minSdk 24
        targetSdk 34
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName pkg.version
        buildConfigField 'String', 'UPDATE_REPO', '"ayato2x/negaafy-updates"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/webassets"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
    }
}

// The UI is the desktop renderer; platform.js is swapped for the Android bridge.
tasks.register('copyWeb', Copy) {
    into "$buildDir/generated/webassets"
    from('../../renderer') {
        into 'web'
        exclude 'platform.js'
    }
    from('../web') { into 'web' }
    from('../../build/icon.png') { into 'build' }
}
preBuild.dependsOn 'copyWeb'

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
